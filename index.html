<script>
/* ==========================================================================
   AGLOC — Etat des lieux — logique applicative
   ========================================================================== */

/* ---------- Constantes charte / métier ---------- */
const STATES = [
  { code: 'NEUF', label: 'Neuf',        color: '#1a6b3c' },
  { code: 'BE',   label: 'Bon état',    color: '#1d4e89' },
  { code: 'EM',   label: 'État moyen',  color: '#b7770d' },
  { code: 'ME',   label: 'Mauvais état',color: '#c2410c' },
  { code: 'DEG',  label: 'Dégradé',     color: '#b03a2e' },
];
const STATE_MAP = Object.fromEntries(STATES.map(s => [s.code, s]));

const CHAUFFAGE_OPTIONS = ['Convecteur élect.', 'Chaudière fioul', 'Chaudière ind. gaz', 'Radiateur gaz', 'Autre PAC', 'Collectif'];
const ECS_OPTIONS = ['Cumulus élect.', 'Chauffe-eau élec.', 'Chaudière ind. gaz', 'Chauffe-eau gaz', 'Autre thermodynamique', 'Collectif'];

const QUICK_CRITERES = ['Sol', 'Plinthes', 'Mur', 'Plafond', 'Porte', 'Huisserie', 'Poignée', 'Serrure',
  'Fenêtre(s)', 'Volets', 'Chauffage', 'Ventilation', 'Éclairage', 'Interrupteur(s)', 'Prise(s)'];

const ROOM_PRESETS = {
  'Pièce vierge': [],
  'Séjour / Cuisine': ['Vue de la pièce et nettoyage', 'Sol', 'Plinthes', 'Mur', 'Plafond', 'Porte(s)', 'Huisserie', 'Fenêtre(s) / Porte-fenêtre', 'Volets', 'Chauffage', 'Ventilation', 'Éclairage', 'Prise(s)', 'Évier', 'Plaque de cuisson', 'Hotte', 'Four', 'Plan de travail', 'Crédence'],
  'Chambre': ['Vue de la pièce et nettoyage', 'Sol', 'Plinthes', 'Mur', 'Plafond', 'Porte(s)', 'Huisserie', 'Serrure', 'Fenêtre(s)', 'Chauffage', 'Ventilation', 'Éclairage', 'Prise(s)', 'Placard'],
  'Salle d\'eau / Salle de bain': ['Vue de la pièce et nettoyage', 'Sol', 'Mur', 'Plafond', 'Porte(s)', 'Fenêtre(s)', 'Chauffage', 'Ventilation', 'Éclairage', 'Miroir', 'Douche / Baignoire', 'Robinetterie', 'Joints', 'Lavabo', 'Meuble sous lavabo'],
  'WC': ['Vue de la pièce et nettoyage', 'Sol', 'Plinthes', 'Mur', 'Plafond', 'Porte(s)', 'Ventilation', 'Éclairage', 'WC - Cuvette', 'WC - Abattant', 'WC - Mécanisme chasse d\'eau'],
  'Buanderie': ['Vue de la pièce et nettoyage', 'Sol', 'Plinthes', 'Mur', 'Plafond', 'Ballon d\'eau chaude', 'Ventilation', 'Éclairage', 'Prise(s)', 'Sécurité - Détecteur de fumée', 'Évacuation machine à laver'],
  'Dégagement / Couloir': ['Vue de la pièce et nettoyage', 'Sol', 'Plinthes', 'Mur', 'Plafond', 'Porte(s)', 'Éclairage', 'Interrupteur(s)', 'Prise(s)', 'Sécurité - Détecteur de fumée'],
  'Garage / Cave': ['Vue de la pièce et nettoyage', 'Sol', 'Mur', 'Plafond', 'Porte', 'Éclairage', 'Compteur électrique'],
  'Terrain - Extérieur avant': ['Vue de la pièce et nettoyage', 'Sol', 'Mur', 'Carport / Portail', 'Boîte aux lettres', 'Poubelle'],
  'Terrain - Extérieur arrière': ['Vue de la pièce et nettoyage', 'Sol', 'Terrasse', 'Mur / Clôture', 'Abri de jardin', 'PAC'],
};

const METER_TYPES = ['Électricité HC Saison Basse', 'Électricité HP Saison Basse', 'Électricité HC Saison Haute',
  'Électricité HP Saison Haute', 'Électricité PRM', 'Eau froide', 'Eau chaude', 'Gaz', 'Fibre'];

/* ---------- Utilitaires ---------- */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function el(tag, opts) {
  opts = opts || {};
  const node = document.createElement(tag);
  if (opts.class) node.className = opts.class;
  if (opts.text !== undefined) node.textContent = opts.text;
  if (opts.html !== undefined) node.innerHTML = opts.html;
  if (opts.attrs) Object.entries(opts.attrs).forEach(([k, v]) => node.setAttribute(k, v));
  if (opts.on) Object.entries(opts.on).forEach(([evt, fn]) => node.addEventListener(evt, fn));
  if (opts.children) opts.children.forEach(c => c && node.appendChild(c));
  return node;
}

function debounce(fn, wait) {
  let t;
  return function (...args) {
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), wait);
  };
}

function fmtDate(d) {
  const dt = d ? new Date(d) : new Date();
  return dt.toLocaleDateString('fr-FR');
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('lecture impossible'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('image invalide'));
      img.onload = () => {
        const maxDim = 1280;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.62));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- Polyfill de stockage (autonome hors Claude) ----------
   Si l'appli tourne dans l'environnement Claude, window.storage existe déjà.
   Sinon (GitHub Pages, ouverture locale, PWA installée...), on simule la
   même API (get/set/delete) avec IndexedDB, adapté au volume des photos. */
(function () {
  if (window.storage && typeof window.storage.get === 'function') return; // déjà présent (Claude)

  const DB_NAME = 'aglocEdlDB';
  const STORE = 'kv';
  let dbPromise = null;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        req.result.createObjectStore(STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }

  async function idbGet(key) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function idbSet(key, value) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function idbDelete(key) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  window.storage = {
    async get(key /*, shared */) {
      const value = await idbGet(key);
      if (value === undefined) return null;
      return { key, value, shared: false };
    },
    async set(key, value /*, shared */) {
      await idbSet(key, value);
      return { key, value, shared: false };
    },
    async delete(key /*, shared */) {
      await idbDelete(key);
      return { key, deleted: true, shared: false };
    },
    async list(prefix /*, shared */) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readonly');
        const req = tx.objectStore(STORE).getAllKeys();
        req.onsuccess = () => {
          let keys = req.result;
          if (prefix) keys = keys.filter(k => String(k).startsWith(prefix));
          resolve({ keys, prefix, shared: false });
        };
        req.onerror = () => reject(req.error);
      });
    }
  };
})();

/* ---------- Numérotation automatique des dossiers ---------- */
async function nextDossierNumber() {
  const year = new Date().getFullYear();
  const key = 'edl:counter:' + year;
  let seq = 1;
  try {
    const r = await window.storage.get(key, false);
    seq = r ? (parseInt(r.value, 10) + 1) : 1;
  } catch (e) { seq = 1; }
  try { await window.storage.set(key, String(seq), false); } catch (e) {}
  return 'AGLOC-' + year + '-' + String(seq).padStart(4, '0');
}

/* ---------- Stockage ---------- */
const Store = {
  async getMandataires() {
    try {
      const r = await window.storage.get('mandataires:list', false);
      return r ? JSON.parse(r.value) : [];
    } catch (e) { return []; }
  },
  async saveMandataires(list) {
    await window.storage.set('mandataires:list', JSON.stringify(list), false);
  },
  async getIndex() {
    try {
      const r = await window.storage.get('edl:index', false);
      return r ? JSON.parse(r.value) : [];
    } catch (e) { return []; }
  },
  async setIndex(list) {
    await window.storage.set('edl:index', JSON.stringify(list), false);
  },
  async getInspection(id) {
    try {
      const r = await window.storage.get('edl:data:' + id, false);
      return r ? JSON.parse(r.value) : null;
    } catch (e) { return null; }
  },
  async saveInspection(insp) {
    insp.updatedAt = new Date().toISOString();
    await window.storage.set('edl:data:' + insp.id, JSON.stringify(insp), false);
    const idx = await this.getIndex();
    const i = idx.findIndex(x => x.id === insp.id);
    const entry = {
      id: insp.id, type: insp.type, dossier: insp.dossier,
      adresse: insp.bienAdresse, updatedAt: insp.updatedAt
    };
    if (i >= 0) idx[i] = entry; else idx.unshift(entry);
    await this.setIndex(idx);
  },
  async deleteInspection(id) {
    const insp = await this.getInspection(id);
    if (insp) {
      const photoIds = collectPhotoIds(insp);
      for (const pid of photoIds) {
        try { await window.storage.delete('photo:' + pid, false); } catch (e) {}
      }
    }
    try { await window.storage.delete('edl:data:' + id, false); } catch (e) {}
    const idx = await this.getIndex();
    await this.setIndex(idx.filter(x => x.id !== id));
  },
  async getPhoto(photoId) {
    try {
      const r = await window.storage.get('photo:' + photoId, false);
      return r ? r.value : null;
    } catch (e) { return null; }
  },
  async setPhoto(photoId, dataUrl) {
    await window.storage.set('photo:' + photoId, dataUrl, false);
  },
  async deletePhoto(photoId) {
    try { await window.storage.delete('photo:' + photoId, false); } catch (e) {}
  }
};

function collectPhotoIds(insp) {
  const ids = [];
  (insp.compteurs || []).forEach(m => (m.photos || []).forEach(p => ids.push(p)));
  (insp.pieces || []).forEach(room => (room.lignes || []).forEach(l => (l.photos || []).forEach(p => ids.push(p))));
  return ids;
}

async function duplicateInspection(id) {
  const src = await Store.getInspection(id);
  if (!src) return;
  const otherType = src.type === 'entree' ? 'sortie' : 'entree';
  const copy = newInspection(otherType);
  copy.dossier = await nextDossierNumber();
  copy.mandataire = src.mandataire ? { ...src.mandataire } : null;
  copy.proprietaire = src.proprietaire;
  copy.bienType = src.bienType;
  copy.bienPieces = src.bienPieces;
  copy.bienAdresse = src.bienAdresse;
  copy.fournisseurTel = src.fournisseurTel;
  copy.fournisseurGaz = src.fournisseurGaz;
  copy.fournisseurElec = src.fournisseurElec;
  copy.cles = JSON.parse(JSON.stringify(src.cles || []));
  copy.chauffage = [...(src.chauffage || [])];
  copy.ecs = [...(src.ecs || [])];
  copy.pieces = (src.pieces || []).map(room => ({
    id: uid(), nom: room.nom,
    lignes: (room.lignes || []).map(l => newLigne(l.critere))
  }));
  await Store.saveInspection(copy);
  openInspection(copy.id);
}

  'Maison', 'Appartement', 'Studio', 'Duplex', 'Triplex', 'Loft', 'Villa', 'Chalet',

function buildBienTypeSelector() {
  const wrap = el('div', { class: 'field' });
  wrap.appendChild(el('label', { text: 'Type de bien' }));
  const select = el('select');
  BIEN_TYPES.forEach(t => {
    const o = el('option', { text: t }); o.value = t;
    select.appendChild(o);
  });
  const autreOpt = el('option', { text: 'Autre…' }); autreOpt.value = '__autre__';
  select.appendChild(autreOpt);

  const isKnown = BIEN_TYPES.includes(CURRENT.bienType);
  select.value = isKnown ? CURRENT.bienType : '__autre__';

  const autreInput = el('input', {
    class: 'bien-type-autre',
    attrs: { type: 'text', placeholder: 'Précisez le type de bien' }
  });
  autreInput.value = isKnown ? '' : (CURRENT.bienType || '');
  autreInput.style.display = isKnown ? 'none' : 'block';
  autreInput.style.marginTop = '6px';
  autreInput.addEventListener('input', () => { CURRENT.bienType = autreInput.value; markDirty(); });

  select.addEventListener('change', () => {
    if (select.value === '__autre__') {
      autreInput.style.display = 'block';
      autreInput.focus();
      CURRENT.bienType = autreInput.value || '';
    } else {
      autreInput.style.display = 'none';
      CURRENT.bienType = select.value;
    }
    markDirty();
  });

  wrap.appendChild(select);
  wrap.appendChild(autreInput);
  return wrap;
}

function buildMandataireSelector() {
  const wrap = el('div', { class: 'field field-wide' });
  wrap.appendChild(el('label', { text: 'Mandataire / agence' }));
  const select = el('select');
  const emptyOpt = el('option', { text: '— Sélectionner un mandataire —' }); emptyOpt.value = '';
  select.appendChild(emptyOpt);
  MANDATAIRES_CACHE.forEach(m => {
    const o = el('option', { text: m.nom + (m.agence ? ' — ' + m.agence : '') });
    o.value = m.id;
    if (CURRENT.mandataire && CURRENT.mandataire.id === m.id) o.selected = true;
    select.appendChild(o);
  });
  const addOpt = el('option', { text: '+ Nouveau mandataire…' }); addOpt.value = '__new__';
  select.appendChild(addOpt);
  select.addEventListener('change', () => {
    if (select.value === '__new__') {
      select.value = CURRENT.mandataire ? CURRENT.mandataire.id : '';
      openMandataireQuickAdd(created => {
        CURRENT.mandataire = created;
        markDirty();
        renderEditor('general');
      });
      return;
    }
    const m = MANDATAIRES_CACHE.find(x => x.id === select.value);
    CURRENT.mandataire = m ? { id: m.id, nom: m.nom, agence: m.agence, telephone: m.telephone, email: m.email, adresse: m.adresse } : null;
    markDirty();
    renderEditor('general');
  });
  wrap.appendChild(select);
  if (CURRENT.mandataire) {
    const info = el('div', { class: 'mandataire-info' });
    if (CURRENT.mandataire.telephone) info.appendChild(el('div', { text: '📞 ' + CURRENT.mandataire.telephone }));
    if (CURRENT.mandataire.email) info.appendChild(el('div', { text: '✉️ ' + CURRENT.mandataire.email }));
    if (CURRENT.mandataire.adresse) info.appendChild(el('div', { text: '📍 ' + CURRENT.mandataire.adresse }));
    wrap.appendChild(info);
  }
  return wrap;
}

function buildCheckOption(label, arr) {
  const wrap = el('label', { class: 'check-option' });
  const cb = el('input', { attrs: { type: 'checkbox' } });
  cb.checked = arr.includes(label);
  cb.addEventListener('change', () => {

    if (cb.checked && i === -1) arr.push(label);

function buildPhotoWidget(photoIds, onChange) {
  const wrap = el('div', { class: 'photo-widget' });

  wrap.appendChild(strip);

  const renderStrip = () => {
    strip.innerHTML = '';

      const img = el('img');
      Store.getPhoto(pid).then(url => { if (url) img.src = url; });
      thumb.appendChild(img);
      thumb.appendChild(el('button', {
        class: 'photo-del', text: '✕',
        on: {
          click: async () => {
            await Store.deletePhoto(pid);
            photoIds.splice(i, 1);
            onChange();
            renderStrip();
          }
        }
      }));
      strip.appendChild(thumb);
    });
    const addBtn = el('label', { class: 'photo-add' });
    addBtn.appendChild(el('span', { text: '+ Photo' }));
    const input = el('input', { attrs: { type: 'file', accept: 'image/*', multiple: 'multiple' } });
    input.style.display = 'none';
    input.addEventListener('change', async () => {
      const files = Array.from(input.files || []);
      for (const f of files) {
        try {
          const dataUrl = await compressImage(f);
          const pid = uid();
          await Store.setPhoto(pid, dataUrl);
          photoIds.push(pid);
        } catch (e) { /* ignore fichier illisible */ }
      }
      input.value = '';
      onChange();
      renderStrip();
    });
    addBtn.appendChild(input);
    strip.appendChild(addBtn);
  };
  renderStrip();
  return wrap;
}

function buildSignaturePad(key, label) {
  const box = el('div', { class: 'sig-box' });
  box.appendChild(el('div', { class: 'sig-label', text: label }));
  const canvas = el('canvas', { class: 'sig-canvas', attrs: { width: '320', height: '150' } });
  box.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#131e30';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  let drawing = false, hasDrawn = false;
  const existing = CURRENT.signatures[key];
  if (existing) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    img.src = existing;
    hasDrawn = true;
  }

  function pos(e) {
    const r = canvas.getBoundingClientRect();
    const scaleX = canvas.width / r.width, scaleY = canvas.height / r.height;
    const p = e.touches ? e.touches[0] : e;
    return { x: (p.clientX - r.left) * scaleX, y: (p.clientY - r.top) * scaleY };
  }
  function start(e) { drawing = true; hasDrawn = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
  function move(e) { if (!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }
  function end() {
    if (!drawing) return;
    drawing = false;
    CURRENT.signatures[key] = canvas.toDataURL('image/png');
    markDirty();
  }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);

  const clearBtn = el('button', {
    class: 'btn btn-ghost btn-sm', text: 'Effacer',
    on: {
      click: () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        CURRENT.signatures[key] = null;
        hasDrawn = false;
        markDirty();
      }
    }
  });
  box.appendChild(clearBtn);
  return box;
}

function hexToRgb(hex) {
  const v = hex.replace('#', '');
  return [parseInt(v.substring(0, 2), 16), parseInt(v.substring(2, 4), 16), parseInt(v.substring(4, 6), 16)];
}

async function generatePDF(insp) {
  if (!window.jspdf) { alert('La bibliothèque PDF n\'a pas pu se charger. Vérifiez la connexion internet.'); return; }

  /* --- préchargement des photos --- */
  const photoIds = collectPhotoIds(insp);
  const photoCache = {};
  for (const pid of photoIds) {
    const url = await Store.getPhoto(pid);
    if (url) photoCache[pid] = url;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 40;
  const NAVY = [19, 30, 48], GOLD = [213, 168, 108], SUBTLE = [90, 106, 122], LIGHTBLUE = [236, 247, 254];
  const state = { y: 84, page: 1 };

  function drawHeader() {
    doc.setFillColor(NAVY[0], NAVY[1], NAVY[2]);
    doc.rect(0, 0, pageW, 60, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(18);
    doc.text('AGLOC', margin, 30);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8.5);
    doc.text('Accompagnement locatif — Groupe AG', margin, 44);
    const title = insp.type === 'entree' ? "État des lieux d'entrée" : 'État des lieux de sortie';
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.text(title, pageW - margin, 26, { align: 'right' });
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8.5);
    doc.text('Dossier ' + (insp.dossier || '—'), pageW - margin, 40, { align: 'right' });
    doc.setFillColor(GOLD[0], GOLD[1], GOLD[2]);
    doc.rect(0, 60, pageW, 4, 'F');
  }

  function drawFooter() {
    doc.setDrawColor(GOLD[0], GOLD[1], GOLD[2]);
    doc.setLineWidth(0.75);
    doc.line(margin, pageH - 34, pageW - margin, pageH - 34);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(7.5);
    doc.setTextColor(SUBTLE[0], SUBTLE[1], SUBTLE[2]);
    doc.text('AGLOC — Accompagnement locatif', margin, pageH - 22);
    doc.text('Page ' + state.page, pageW - margin, pageH - 22, { align: 'right' });
  }

  function newPage() {
    doc.addPage();
    state.page += 1;
    drawHeader();
    drawFooter();
    state.y = 84;
  }

  function ensureSpace(h) {
    if (state.y + h > pageH - 50) newPage();
  }

  function sectionTitle(text) {
    ensureSpace(26);
    doc.setFillColor(LIGHTBLUE[0], LIGHTBLUE[1], LIGHTBLUE[2]);
    doc.rect(margin, state.y, pageW - margin * 2, 20, 'F');
    doc.setTextColor(NAVY[0], NAVY[1], NAVY[2]);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(10.5);
    doc.text(text, margin + 8, state.y + 14);
    state.y += 30;
  }

  function roomTitle(text) {
    ensureSpace(28);
    doc.setFillColor(NAVY[0], NAVY[1], NAVY[2]);
    doc.rect(margin, state.y, pageW - margin * 2, 20, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(10);
    doc.text(text.toUpperCase(), margin + 8, state.y + 14);
    state.y += 30;
  }

  function drawKV(x, label, value, maxW) {
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8);
    doc.setTextColor(SUBTLE[0], SUBTLE[1], SUBTLE[2]);
    const labelTxt = label + ' : ';
    doc.text(labelTxt, x, state.y);
    const lw = doc.getTextWidth(labelTxt);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(NAVY[0], NAVY[1], NAVY[2]);
    doc.text(String(value || '—'), x + lw, state.y, { maxWidth: Math.max(20, maxW - lw) });
  }

  function rowPairs(pairs) {
    const half = (pageW - 2 * margin) / 2;
    for (let i = 0; i < pairs.length; i += 2) {
      ensureSpace(16);
      drawKV(margin, pairs[i][0], pairs[i][1], half - 10);
      if (pairs[i + 1]) drawKV(margin + half, pairs[i + 1][0], pairs[i + 1][1], half - 10);
      state.y += 16;
    }
    state.y += 8;
  }

  function checklistLine(options, selected) {
    ensureSpace(16);
    let x = margin;
    options.forEach(o => {
      const checked = selected.includes(o);
      const w = doc.getTextWidth(o) + 16;
      if (x + w > pageW - margin) { x = margin; state.y += 16; ensureSpace(16); }
      doc.setDrawColor(NAVY[0], NAVY[1], NAVY[2]);
      doc.rect(x, state.y - 8, 8, 8);
      if (checked) {
        doc.setFillColor(GOLD[0], GOLD[1], GOLD[2]);
        doc.rect(x + 1.2, state.y - 6.8, 5.6, 5.6, 'F');
      }
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8.5);
      doc.setTextColor(NAVY[0], NAVY[1], NAVY[2]);
      doc.text(o, x + 12, state.y);
      x += w + 6;
    });
    state.y += 20;
  }

  function table(headers, rows, colWidths) {
    ensureSpace(18);
    let x = margin;
    doc.setFillColor(NAVY[0], NAVY[1], NAVY[2]);
    doc.setTextColor(255, 255, 255);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8);
    const rowH = 16;
    headers.forEach((h, i) => { doc.rect(x, state.y, colWidths[i], rowH, 'F'); doc.text(h, x + 4, state.y + 11); x += colWidths[i]; });
    state.y += rowH;
    rows.forEach((r, ri) => {
      ensureSpace(rowH);
      x = margin;
      const fill = ri % 2 === 0 ? LIGHTBLUE : [255, 255, 255];
      r.forEach((cell, i) => {
        doc.setFillColor(fill[0], fill[1], fill[2]);
        doc.setDrawColor(GOLD[0], GOLD[1], GOLD[2]);
        doc.rect(x, state.y, colWidths[i], rowH, 'FD');
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8);
        doc.setTextColor(NAVY[0], NAVY[1], NAVY[2]);
        doc.text(String(cell === undefined || cell === null || cell === '' ? '—' : cell), x + 4, state.y + 11, { maxWidth: colWidths[i] - 8 });
        x += colWidths[i];
      });
      state.y += rowH;
    });
    state.y += 12;
  }

  function photoRow(photoIdsForRow) {
    const photos = (photoIdsForRow || []).map(pid => photoCache[pid]).filter(Boolean);
    if (!photos.length) return;
    const thumbW = 78, thumbH = 58, gap = 6;
    let x = margin;
    ensureSpace(thumbH + 6);
    photos.forEach(durl => {
      if (x + thumbW > pageW - margin) { x = margin; state.y += thumbH + gap; ensureSpace(thumbH + 6); }
      try { doc.addImage(durl, 'JPEG', x, state.y, thumbW, thumbH); } catch (e) { /* ignore image invalide */ }
      x += thumbW + gap;
    });
    state.y += thumbH + 10;
  }

  /* ---- Table "Détails de l'état des lieux" (grille identique au modèle) ---- */
  const ETAT_COLS = ['NEUF', 'BE', 'EM', 'ME', 'DEG'];
  const ETAT_LABELS = { NEUF: 'NEUF', BE: 'B.E', EM: 'E.M', ME: 'M.E', DEG: 'DEG' };
  const COL = {
    critere: 128,
    etat: 30,
    nettoyage: 46,
  };
  COL.commentaire = (pageW - 2 * margin) - COL.critere - COL.etat * ETAT_COLS.length - COL.nettoyage;

  function etatTableHeader() {
    ensureSpace(30);
    let x = margin;
    const rowH = 26;
    doc.setFillColor(NAVY[0], NAVY[1], NAVY[2]);
    doc.setTextColor(255, 255, 255);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(7.5);
    doc.rect(x, state.y, COL.critere, rowH, 'F');
    doc.text('Critères', x + 5, state.y + 15);
    x += COL.critere;
    ETAT_COLS.forEach(code => {
      doc.rect(x, state.y, COL.etat, rowH, 'F');
      doc.text(ETAT_LABELS[code], x + COL.etat / 2, state.y + 15, { align: 'center' });
      x += COL.etat;
    });
    doc.rect(x, state.y, COL.nettoyage, rowH, 'F');
    doc.text('Nettoy.', x + COL.nettoyage / 2, state.y + 11, { align: 'center' });
    doc.text('incompl.', x + COL.nettoyage / 2, state.y + 20, { align: 'center' });
    x += COL.nettoyage;
    doc.rect(x, state.y, COL.commentaire, rowH, 'F');
    doc.text('Commentaires', x + 5, state.y + 15);
    state.y += rowH;
  }

  function drawLigne(ligne) {
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8.5);
    const critereLines = doc.splitTextToSize(ligne.critere || '(sans nom)', COL.critere - 10);
    doc.setFont('helvetica', 'italic');
    doc.setFontSize(7);
    const substratLines = ligne.substrat ? doc.splitTextToSize('Substrat : ' + ligne.substrat, COL.critere - 10) : [];
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    const commentLines = ligne.commentaire ? doc.splitTextToSize(ligne.commentaire, COL.commentaire - 10) : [];

    const critereH = critereLines.length * 10 + substratLines.length * 9 + 10;
    const commentH = commentLines.length * 10 + 10;
    const rowH = Math.max(24, critereH, commentH);

    const pageBefore = state.page;
    ensureSpace(rowH + 4);
    if (state.page !== pageBefore) etatTableHeader();
    let x = margin;
    const y0 = state.y;

    doc.setDrawColor(GOLD[0], GOLD[1], GOLD[2]);
    doc.setLineWidth(0.6);

    /* Critère + substrat */
    doc.rect(x, y0, COL.critere, rowH, 'S');
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8.5);
    doc.setTextColor(NAVY[0], NAVY[1], NAVY[2]);
    doc.text(critereLines, x + 5, y0 + 12);
    if (substratLines.length) {
      doc.setFont('helvetica', 'italic');
      doc.setFontSize(7);
      doc.setTextColor(SUBTLE[0], SUBTLE[1], SUBTLE[2]);
      doc.text(substratLines, x + 5, y0 + 12 + critereLines.length * 10 + 6);
    }
    x += COL.critere;

    /* Colonnes d'état : case cochée (X) dans la colonne correspondante */
    ETAT_COLS.forEach(code => {
      doc.setDrawColor(GOLD[0], GOLD[1], GOLD[2]);
      doc.rect(x, y0, COL.etat, rowH, 'S');
      if (ligne.etat === code) {
        const s = STATE_MAP[code];
        const rgb = hexToRgb(s.color);
        doc.setTextColor(rgb[0], rgb[1], rgb[2]);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(11);
        doc.text('X', x + COL.etat / 2, y0 + rowH / 2 + 4, { align: 'center' });
      }
      x += COL.etat;
    });

    /* Nettoyage incomplet */
    doc.rect(x, y0, COL.nettoyage, rowH, 'S');
    if (ligne.nettoyage) {
      doc.setTextColor(183, 119, 13);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11);
      doc.text('X', x + COL.nettoyage / 2, y0 + rowH / 2 + 4, { align: 'center' });
    }
    x += COL.nettoyage;

    /* Commentaires */
    doc.rect(x, y0, COL.commentaire, rowH, 'S');
    if (commentLines.length) {
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8);
      doc.setTextColor(NAVY[0], NAVY[1], NAVY[2]);
      doc.text(commentLines, x + 5, y0 + 12);
    }

    state.y = y0 + rowH;

    if ((ligne.photos || []).length) {
      state.y += 4;
      photoRow(ligne.photos);
    }
  }

  /* ---------------- construction du document ---------------- */
  drawHeader(); drawFooter();

  const mandataireStr = insp.mandataire
    ? [insp.mandataire.nom, insp.mandataire.agence].filter(Boolean).join(' — ') +
      (insp.mandataire.telephone ? ' · ' + insp.mandataire.telephone : '')
    : '';

  sectionTitle('Informations générales');
  rowPairs([
    ['Numéro de dossier', insp.dossier],
    ['Date', fmtDate(insp.updatedAt)],
    ['Technicien', insp.technicien],
    ['Mandataire', mandataireStr],
    ['Propriétaire', insp.proprietaire],
    ['Type de bien', insp.bienType + (insp.bienPieces ? ' — ' + insp.bienPieces + ' pièce(s)' : '')],
    ['Adresse', insp.bienAdresse],
  ]);

  sectionTitle('Locataires');
  rowPairs([
    ['Entrant', insp.entrantNom], ['Date d\'entrée', insp.entrantDate ? fmtDate(insp.entrantDate) : ''],
    ['Sortant', insp.sortantNom], ['Date de sortie', insp.sortantDate ? fmtDate(insp.sortantDate) : ''],
  ]);

  sectionTitle('Fournisseurs');
  rowPairs([
    ['Ligne téléphonique', insp.fournisseurTel], ['Gaz', insp.fournisseurGaz],
    ['Électricité', insp.fournisseurElec], ['', ''],
  ]);

  sectionTitle('Clés remises');
  table(['Nombre', 'Numéro', 'Observations'],
    insp.cles.map(c => [c.nombre, c.numero, c.obs]),
    [70, 120, pageW - 2 * margin - 190]);

  sectionTitle('Relevé des compteurs');
  table(['Type', 'Relevé', 'Date', 'Coupé', 'Observations'],
    insp.compteurs.map(m => [m.type, m.releve, m.date, m.coupe, m.obs]),
    [150, 70, 65, 45, pageW - 2 * margin - 330]);
  insp.compteurs.forEach(m => { if ((m.photos || []).length) photoRow(m.photos); });

  sectionTitle('Type de chauffage');
  checklistLine(CHAUFFAGE_OPTIONS, insp.chauffage);
  sectionTitle('Production d\'eau chaude');
  checklistLine(ECS_OPTIONS, insp.ecs);
  if (insp.entretienGaz) {
    ensureSpace(14);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(NAVY[0], NAVY[1], NAVY[2]);
    doc.text('Entretien gaz : ' + insp.entretienGaz, margin, state.y);
    state.y += 18;
  }

  insp.pieces.forEach(room => {
    roomTitle(room.nom);
    if (!room.lignes.length) {
      doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5); doc.setTextColor(SUBTLE[0], SUBTLE[1], SUBTLE[2]);
      doc.text('Aucune ligne renseignée.', margin, state.y); state.y += 16;
    } else {
      etatTableHeader();
    }
    room.lignes.forEach(l => drawLigne(l));
    state.y += 10;
  });

  sectionTitle('État de propreté générale');
  const propreteLabel = { bon: 'Bon', incomplet: 'Incomplet', mauvais: 'Mauvais' }[insp.proprete] || '—';
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(NAVY[0], NAVY[1], NAVY[2]);
  doc.text(propreteLabel, margin, state.y); state.y += 20;

  const degrades = [];
  const incomplets = [];
  insp.pieces.forEach(room => room.lignes.forEach(l => {
    if (l.etat === 'DEG') degrades.push({ room: room.nom, l });
    if (l.nettoyage) incomplets.push({ room: room.nom, l });
  }));

  sectionTitle('Éléments dégradés');
  if (!degrades.length) {
    doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5); doc.setTextColor(SUBTLE[0], SUBTLE[1], SUBTLE[2]);
    doc.text('Aucun élément dégradé recensé.', margin, state.y); state.y += 16;
  } else {
    table(['Pièce', 'Élément', 'Commentaire'],
      degrades.map(d => [d.room, d.l.critere, d.l.commentaire]),
      [130, 130, pageW - 2 * margin - 260]);
  }

  sectionTitle('Nettoyage incomplet');
  if (!incomplets.length) {
    doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5); doc.setTextColor(SUBTLE[0], SUBTLE[1], SUBTLE[2]);
    doc.text('Rien à signaler.', margin, state.y); state.y += 16;
  } else {
    table(['Pièce', 'Élément', 'Commentaire'],
      incomplets.map(d => [d.room, d.l.critere, d.l.commentaire]),
      [130, 130, pageW - 2 * margin - 260]);
  }

  /* ---------------- page signatures ---------------- */
  newPage();
  sectionTitle('Signatures des parties');
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(SUBTLE[0], SUBTLE[1], SUBTLE[2]);
  const legal = "Les parties reconnaissent avoir pris connaissance de la totalité du présent état des lieux et en attestent l'exactitude. Ce document, établi contradictoirement, fait partie intégrante du contrat de location et ne peut en être dissocié, conformément à l'article 3-2 de la loi n°89-462 du 6 juillet 1989 et au décret n°2016-382 du 30 mars 2016.";
  const legalLines = doc.splitTextToSize(legal, pageW - 2 * margin);
  doc.text(legalLines, margin, state.y);
  state.y += legalLines.length * 11 + 20;

  const sigKeys = insp.type === 'entree'
    ? [['entrant', 'Locataire entrant', insp.entrantNom], ['proprietaire', 'Propriétaire / mandataire', insp.proprietaire]]
    : [['sortant', 'Locataire sortant', insp.sortantNom], ['entrant', 'Locataire entrant', insp.entrantNom], ['proprietaire', 'Propriétaire / mandataire', insp.proprietaire]];

  const boxW = (pageW - 2 * margin - (sigKeys.length - 1) * 16) / sigKeys.length;
  const boxH = 130;
  ensureSpace(boxH + 20);
  sigKeys.forEach((sk, i) => {
    const x = margin + i * (boxW + 16);
    doc.setDrawColor(GOLD[0], GOLD[1], GOLD[2]);
    doc.setLineWidth(1);
    doc.rect(x, state.y, boxW, boxH);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(NAVY[0], NAVY[1], NAVY[2]);
    doc.text(sk[1], x + 6, state.y + 14);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(SUBTLE[0], SUBTLE[1], SUBTLE[2]);
    doc.text(sk[2] || '', x + 6, state.y + 26, { maxWidth: boxW - 12 });
    const sigData = insp.signatures[sk[0]];
    if (sigData) {
      try { doc.addImage(sigData, 'PNG', x + 6, state.y + 34, boxW - 12, boxH - 44); } catch (e) { /* ignore */ }
    } else {
      doc.setFont('helvetica', 'italic'); doc.setFontSize(8); doc.setTextColor(200, 200, 200);
      doc.text('Non signé', x + 6, state.y + boxH - 10);
    }
  });
  state.y += boxH + 20;

  const filename = 'EDL_' + (insp.type === 'entree' ? 'Entree' : 'Sortie') + '_' +
    (insp.dossier ? insp.dossier.replace(/[^a-zA-Z0-9_-]+/g, '_') : insp.id) + '.pdf';
  doc.save(filename);
}
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
